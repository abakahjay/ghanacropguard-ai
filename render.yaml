# Render Blueprint: the GhanaCropGuard web app as a static site.
# The API is FullBackendd (https://fullbackendd.onrender.com, routes under /api/v1/cropguard).
services:
  - type: web
    name: ghanacropguard-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://fullbackendd.onrender.com
      - key: NODE_VERSION
        value: "22"
    routes:
      # Single-page app: let the client router handle every path.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The session token is in localStorage, so only this site's own scripts may run,
      # and the page may only talk to FullBackendd.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://fullbackendd.onrender.com; connect-src 'self' https://fullbackendd.onrender.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # The service worker must always be re-checked so updates reach installed apps.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
