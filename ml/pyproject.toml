[project]
name = "cropguard-ml"
version = "0.1.0"
description = "GhanaCropGuard AI: dataset preparation, training, evaluation and export"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
train = ["torch>=2.3", "torchvision>=0.18", "timm>=1.0", "scikit-learn>=1.4", "matplotlib>=3.8",
         "pyyaml>=6", "requests>=2.31", "onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cropguard_ml*"]

